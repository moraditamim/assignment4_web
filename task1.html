<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="task1.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">

        <form class="card ticket-card" action="#" method="get" aria-labelledby="form-title">
          <div class="card-header ticket-header">
            <h1 class="h4 mb-0" id="form-title">Book a train ticket</h1>
          </div>

          <div class="card-body p-3 p-md-5">

            <!-- Trip type: two radio inputs shown as a Bootstrap button group -->
            <fieldset class="mb-4">
              <legend class="visually-hidden">Trip type</legend>
              <div class="btn-group trip-toggle d-flex d-md-inline-flex" role="group">
                <input type="radio" class="btn-check" name="trip" id="oneway" value="one-way" checked required>
                <label class="btn" for="oneway">One way</label>
                <input type="radio" class="btn-check" name="trip" id="round" value="round-trip" required>
                <label class="btn" for="round">Round trip</label>
              </div>
            </fieldset>

            <!-- From / To: floating labels -->
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="Astana" autocomplete="off" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" autocomplete="off" required>
                  <label for="to">To</label>
                </div>
              </div>
            </div>

            <!-- Dates and passengers: date inputs and a select -->
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers">
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>
            </div>

            <!-- Carriage class: inline radios -->
            <fieldset class="mb-4">
              <legend class="form-label">Carriage class</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked required>
                <label class="form-check-label" for="coupe">Coupé</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper" required>
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </fieldset>

            <!-- Phone (input group) and Email -->
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" id="phone-prefix">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78"
                         inputmode="tel" autocomplete="tel-national" aria-describedby="phone-prefix" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
            </div>

            <!-- Switch and checkbox -->
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
              <label class="form-check-label" for="agree">I agree with the carriage rules</label>
            </div>

            <!-- HTML order: Clear, then Find trains.
                 On a phone flex-column-reverse puts "Find trains" on top. -->
            <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
              <button type="reset" class="btn btn-clear">Clear</button>
              <button type="submit" class="btn btn-find">Find trains</button>
            </div>

          </div>
        </form>

      </div>
    </div>
  </main>
</body>
</html>
